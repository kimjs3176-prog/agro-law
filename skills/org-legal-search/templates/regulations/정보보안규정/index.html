<h1>정보보안규정</h1>

<p>제1조(목적) 이 규정은 우리 기관의 정보자산을 안전하게 보호하기 위한 정보보안 관리 기준을 정함을 목적으로 한다.</p>

<p>제2조(정의) 이 규정에서 "정보자산"이란 기관이 보유·관리하는 정보 및 정보시스템을 말한다.</p>

<p>제3조(보안책임) 직원은 「개인정보 보호법」 등 관계 법령과 이 규정에 따라 정보보안 의무를 준수하여야 한다.</p>

<p>제4조(접근통제) 정보시스템에 대한 접근 권한은 업무상 필요한 범위로 한정하여 부여한다.</p>

<p>부칙<br/>이 규정은 2025년 3월 1일부터 시행한다.</p>
